<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Ismael Cell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #2563eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: 'Inter', sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-icon {
        width: 72px;
        height: 72px;
        background: rgba(255,255,255,0.15);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-title {
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
        50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(255,255,255,0); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="splash-title">Ismael Cell</div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
      <div id="splash-msg" style="color:rgba(255,255,255,0.6);font-size:13px;margin-top:4px;display:none;">Conectando ao servidor...</div>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        var splash = document.getElementById('splash');
        var msg = document.getElementById('splash-msg');
        function hideSplash() {
          if (!splash) return;
          splash.classList.add('fade-out');
          setTimeout(function() { if (splash && splash.parentNode) splash.remove(); }, 450);
        }
        setTimeout(function() { if (msg) msg.style.display = 'block'; }, 4000);
        setTimeout(function() {
          if (msg) msg.textContent = 'Recarregando...';
          setTimeout(function() { window.location.reload(); }, 2000);
        }, 12000);
        window.__hideSplash = hideSplash;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
