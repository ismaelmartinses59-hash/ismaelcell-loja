<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.9, maximum-scale=1, viewport-fit=cover" />
    <title>Ismael Cell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ismael Cell" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #2563eb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        font-family: 'Inter', sans-serif;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-icon {
        width: 72px;
        height: 72px;
        background: rgba(255,255,255,0.15);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      .splash-title {
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.5);
        animation: splash-dot 1.2s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
        50% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(255,255,255,0); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="splash-title">Ismael Cell</div>
      <div class="splash-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function() {
          // Captura erros de JS desde o início pra sabermos o motivo real de uma
          // tela branca (crash de código != cache antigo).
          window.__errs = window.__errs || [];
          function pushErr(s){ try { window.__errs.push(String(s).slice(0,1600)); } catch (e) {} }
          window.addEventListener('error', function(e){
            pushErr((e.message || 'erro')
              + (e.filename ? (' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno + ':' + e.colno) : '')
              + (e.error && e.error.stack ? ('\n' + e.error.stack) : ''));
          });
          window.addEventListener('unhandledrejection', function(e){
            var r = e.reason;
            pushErr('promise: ' + (r && r.stack ? r.stack : (r && r.message ? r.message : String(r))));
          });
          var splash = document.getElementById('splash');
        var mounted = false;
        function hideSplash() {
          mounted = true;
          if (!splash) return;
          splash.classList.add('fade-out');
          setTimeout(function() { if (splash && splash.parentNode) splash.remove(); }, 400);
        }
        // O splash some sozinho em 3s, sem esperar a API.
        setTimeout(hideSplash, 3000);
        window.__hideSplash = hideSplash;

        // Recuperação automática: se a tela ficar branca (React não conseguiu
          // montar por causa de SW/cache antigo), limpamos o service worker e o
          // cache e recarregamos sozinho — UMA vez por abertura, sem o usuário
          // precisar tocar em nada. Se mesmo assim continuar branco, aí sim
          // mostramos um botão manual.
          function limparCacheEReload() {
            return (async function() {
              try {
                if ('serviceWorker' in navigator) {
                  var regs = await navigator.serviceWorker.getRegistrations();
                  for (var i = 0; i < regs.length; i++) await regs[i].unregister();
                }
                if ('caches' in window) {
                  var keys = await caches.keys();
                  await Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }
              } catch (e) {}
              window.location.reload();
            })();
          }
          setTimeout(function() {
              var root = document.getElementById('root');
              if (root && root.children.length > 0) return; // App montou, ok

              var temErro = window.__errs && window.__errs.length > 0;

              // Sem erro de código => provável cache/rede: recupera sozinho 1x.
              // Com erro de código, recarregar não resolve, então mostramos o erro.
              if (!temErro) {
                var jaTentou;
                try { jaTentou = sessionStorage.getItem('__autoRecovered'); } catch (e) { jaTentou = null; }
                if (!jaTentou) {
                  try { sessionStorage.setItem('__autoRecovered', '1'); } catch (e) {}
                  limparCacheEReload();
                  return;
                }
              }

              var rec = document.createElement('div');
              rec.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0f172a;color:#fff;font-family:Inter,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;overflow:auto;';
              var detalhe = '';
              if (temErro) {
                var txt = window.__errs.join('\n---\n').replace(/[<>]/g, '');
                detalhe = '<pre style="max-width:330px;max-height:210px;overflow:auto;text-align:left;background:#1e293b;color:#fca5a5;font-size:10px;line-height:1.35;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;">' + txt + '</pre>';
              }
              rec.innerHTML = '<div style="font-size:18px;font-weight:700;">Não conseguiu abrir?</div>'
                + '<div style="font-size:13px;opacity:0.75;max-width:290px;">' + (temErro ? 'Encontramos um erro ao abrir. Tire um print desta tela e mande pro suporte.' : 'Toque abaixo para limpar o cache e tentar de novo.') + '</div>'
                + detalhe
                + '<button id="__recBtn" style="background:#2563eb;color:#fff;border:none;padding:12px 28px;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;">Recuperar app</button>';
              document.body.appendChild(rec);
              document.getElementById('__recBtn').onclick = function() { limparCacheEReload(); };
            }, 6000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
