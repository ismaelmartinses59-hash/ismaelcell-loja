openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Service order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /share-shortcut/ios/status:
    get:
      operationId: getIosShortcutStatus
      tags: [health]
      summary: Check whether the iPhone Share Sheet shortcut is configured
      security:
        - financeSession: []
      responses:
        "200":
          description: Shortcut token configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IosShortcutTokenStatus"
        "401":
          description: Authentication required

  /share-shortcut/ios/token:
    post:
      operationId: createIosShortcutToken
      tags: [health]
      summary: Create or rotate the iPhone Share Sheet upload token
      security:
        - financeSession: []
      responses:
        "201":
          description: Newly created token, returned only once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IosShortcutToken"
        "401":
          description: Authentication required
    delete:
      operationId: revokeIosShortcutToken
      tags: [health]
      summary: Revoke the iPhone Share Sheet upload token
      security:
        - financeSession: []
      responses:
        "204":
          description: Token revoked
        "401":
          description: Authentication required

  /share-shortcut/ios/import:
    post:
      operationId: importIosShortcutNote
      tags: [health]
      summary: Read a shared invoice and return a temporary review link
      security:
        - iosShortcutBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IosShortcutImportInput"
      responses:
        "200":
          description: Temporary app link for reviewing extracted items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IosShortcutImportResponse"
        "400":
          description: Invalid upload
        "401":
          description: Invalid or missing shortcut token
        "413":
          description: File too large
        "502":
          description: The invoice could not be interpreted
        "503":
          description: Invoice reader unavailable

  /share-shortcut/ios/draft:
    post:
      operationId: consumeIosShortcutDraft
      tags: [health]
      summary: Consume a temporary shortcut draft for authenticated review
      security:
        - financeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IosShortcutDraftInput"
      responses:
        "200":
          description: Extracted invoice items, ready for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IosShortcutDraftResponse"
        "400":
          description: Invalid or expired draft token
        "401":
          description: Authentication required
        "409":
          description: Draft has already been opened

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List service orders
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by model, service, or line
        - name: status
          in: query
          schema:
            type: string
            enum: [aguardando, "em andamento", concluido, problema, encerrado]
          description: Filter by status
        - name: tipo
          in: query
          schema:
            type: string
            enum: [cliente, lojista]
          description: Filter by order type
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new service order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete a service order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found

  /orders/stats:
    get:
      operationId: getOrderStats
      tags: [orders]
      summary: Get order statistics
      responses:
        "200":
          description: Order statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStats"

components:
  securitySchemes:
    financeSession:
      type: apiKey
      in: cookie
      name: finance_session
    iosShortcutBearer:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Order:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        modelo:
          type: string
        linha:
          type: string
          enum: [xiaomi, samsung, motorola, ios, realme]
        servico:
          type: string
        valor:
          type: string
        tempo:
          type: string
        tipo:
          type: string
          enum: [cliente, lojista]
        nomeCliente:
          type: string
          nullable: true
        senhaDispo:
          type: string
          nullable: true
        garantia:
          type: string
          nullable: true
        dataServico:
          type: string
          nullable: true
        status:
          type: string
          enum: [aguardando, "em andamento", concluido, problema, encerrado]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - codigo
        - modelo
        - linha
        - servico
        - valor
        - tempo
        - status
        - createdAt

    CreateOrderBody:
      type: object
      properties:
        modelo:
          type: string
        linha:
          type: string
          enum: [xiaomi, samsung, motorola, ios, realme]
        servico:
          type: string
        valor:
          type: string
        tempo:
          type: string
        tipo:
          type: string
          enum: [cliente, lojista]
        nomeCliente:
          type: string
          nullable: true
        senhaDispo:
          type: string
          nullable: true
        garantia:
          type: string
          nullable: true
        dataServico:
          type: string
          nullable: true
      required:
        - modelo
        - linha
        - servico
        - valor
        - tempo

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [aguardando, "em andamento", concluido, problema, encerrado]
      required:
        - status

    OrderStats:
      type: object
      properties:
        total:
          type: integer
        aguardando:
          type: integer
        emAndamento:
          type: integer
        concluido:
          type: integer
        problema:
          type: integer
        encerrado:
          type: integer
        comGarantia:
          type: integer
      required:
        - total
        - aguardando
        - emAndamento
        - concluido
        - problema
        - encerrado
        - comGarantia

    IosShortcutTokenStatus:
      type: object
      properties:
        configured:
          type: boolean
      required: [configured]

    IosShortcutToken:
      type: object
      properties:
        token:
          type: string
      required: [token]

    IosShortcutImportInput:
      type: object
      properties:
        fileBase64:
          type: string
          minLength: 1
          maxLength: 10485760
        mimeType:
          type: string
          enum: [application/pdf]
      required: [fileBase64, mimeType]

    IosShortcutImportResponse:
      type: object
      properties:
        openUrl:
          type: string
          format: uri
        itemCount:
          type: integer
          minimum: 0
        expiresInMinutes:
          type: integer
      required: [openUrl, itemCount, expiresInMinutes]

    IosShortcutDraftInput:
      type: object
      properties:
        draftId:
          type: string
          minLength: 32
          maxLength: 80
      required: [draftId]

    IosShortcutDraftItem:
      type: object
      properties:
        modelo:
          type: string
        quantidade:
          type: integer
          minimum: 1
        custo:
          type: string
        qualidade:
          type: string
      required: [modelo, quantidade, custo, qualidade]

    IosShortcutDraftResponse:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/IosShortcutDraftItem"
      required: [itens]
