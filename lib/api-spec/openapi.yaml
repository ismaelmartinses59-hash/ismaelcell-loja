openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: orders
    description: Service order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List service orders
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by model, service, or line
        - name: status
          in: query
          schema:
            type: string
            enum: [aguardando, "em andamento", concluido, problema]
          description: Filter by status
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new service order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get a single order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/stats:
    get:
      operationId: getOrderStats
      tags: [orders]
      summary: Get order statistics
      responses:
        "200":
          description: Order statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Order:
      type: object
      properties:
        id:
          type: integer
        codigo:
          type: string
        modelo:
          type: string
        linha:
          type: string
          enum: [xiaomi, samsung, motorola, ios]
        servico:
          type: string
        valor:
          type: string
        tempo:
          type: string
        status:
          type: string
          enum: [aguardando, "em andamento", concluido, problema]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - codigo
        - modelo
        - linha
        - servico
        - valor
        - tempo
        - status
        - createdAt

    CreateOrderBody:
      type: object
      properties:
        modelo:
          type: string
        linha:
          type: string
          enum: [xiaomi, samsung, motorola, ios]
        servico:
          type: string
        valor:
          type: string
        tempo:
          type: string
      required:
        - modelo
        - linha
        - servico
        - valor
        - tempo

    UpdateOrderStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [aguardando, "em andamento", concluido, problema]
      required:
        - status

    OrderStats:
      type: object
      properties:
        total:
          type: integer
        aguardando:
          type: integer
        emAndamento:
          type: integer
        concluido:
          type: integer
        problema:
          type: integer
      required:
        - total
        - aguardando
        - emAndamento
        - concluido
        - problema
